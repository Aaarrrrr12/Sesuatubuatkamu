<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Bunga yang Belum Sampai</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@500;700&display=swap" rel="stylesheet">
<style>
#snd{position:absolute;top:10px;right:10px;z-index:3;padding:6px 11px;font-size:1rem;background:rgba(255,255,255,.85);color:var(--ink);box-shadow:none}
[hidden]{display:none!important}
:root{--ink:#4b2e45;--soft:#7d5a76;--rose:#ff7aa2;color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
html,body{margin:0}
body{min-height:100dvh;display:grid;place-items:center;padding:16px;color:var(--ink);background:linear-gradient(160deg,#2f2147,#5a3a6b 55%,#8a4f7a);font-family:"Quicksand",ui-rounded,system-ui,sans-serif}
.wrap{width:100%;max-width:520px;position:relative}
svg{display:block;width:100%;height:auto;border-radius:26px;box-shadow:0 18px 50px rgba(20,8,40,.45);color:#ff6f9a}
svg text{font-family:"Quicksand",ui-rounded,system-ui,sans-serif}
.nt *{transition:none!important}
#cap{min-height:64px;margin:16px 6px 0;text-align:center;color:#ffe9f1;font-size:1.08rem;font-weight:500;line-height:1.5}
#cap.on{animation:capIn .7s ease both}
@keyframes capIn{from{opacity:0}to{opacity:1}}
button{font:inherit;font-weight:700;cursor:pointer;border:0;border-radius:999px;padding:12px 20px;color:#fff;background:var(--rose);box-shadow:0 6px 0 #d4577f;transition:transform .15s,box-shadow .15s}
button:active{transform:translateY(4px);box-shadow:0 2px 0 #d4577f}
button:focus-visible{outline:3px solid #fff;outline-offset:3px}
button.ghost{background:transparent;color:#ffd6e4;box-shadow:none;padding:8px 14px;font-weight:500}
button.alt{background:#fff;color:var(--ink);box-shadow:0 6px 0 #c9b3d6}
#start{position:absolute;inset:0 0 auto 0;aspect-ratio:400/440;display:grid;place-content:center;gap:18px;text-align:center;border-radius:26px;background:rgba(10,6,22,.96);color:#fff;padding:24px;transition:opacity .5s}
#start h1{margin:0;font-size:1.6rem;line-height:1.3}
#start p{margin:0;color:#e9d7f3}
#start.off{opacity:0;pointer-events:none}
#end{display:none;margin:16px 0 0;padding:20px;border-radius:22px;background:#fff7fa;text-align:center}
#end.on{display:block;animation:capIn .8s ease both}
#msg{margin:0 0 8px;font-size:1.12rem;line-height:1.6}
.btns{display:flex;gap:12px;justify-content:center;flex-wrap:wrap}
.fade{opacity:0;transition:opacity .9s}.fade.on{opacity:1}
.pop{transform:scale(0);transition:transform 1s cubic-bezier(.3,1.6,.5,1)}.pop.on{transform:scale(var(--s,1))}
.actor{transition-property:transform;transition-timing-function:linear}
.arm{transition:transform .6s ease}.arm.hid{transform:translate(-8px,0) scale(-1,1)}
.flw{transition:opacity .5s}.flw.gone{opacity:0}
.blush{opacity:0;transition:opacity .6s}.shy .blush{opacity:.8}
.smi{opacity:0}.happy .smi{opacity:1}.happy .neu{opacity:0}
.walk .l1{animation:sw .45s ease-in-out infinite alternate}
.walk .l2{animation:sw .45s ease-in-out infinite alternate-reverse}
.walk .bob{animation:bob .45s ease-in-out infinite alternate}
@keyframes sw{from{transform:rotate(-24deg)}to{transform:rotate(24deg)}}
@keyframes bob{to{transform:translateY(-2px)}}
.bub{opacity:0;transition:opacity .3s}.bub.on{opacity:1}
.cloud{animation:drift 40s linear infinite alternate}
@keyframes drift{to{transform:translateX(60px)}}
.pulse{animation:pl 1.6s ease-in-out infinite}
@keyframes pl{50%{opacity:.4}}
.heart{font-size:18px;animation:rise 2.2s ease-out forwards}
@keyframes rise{from{opacity:1;transform:translateY(0)}to{opacity:0;transform:translateY(-80px)}}
.chat{animation:toPot 1.1s ease-in-out forwards}
@keyframes toPot{from{opacity:0;transform:translate(0,0)}15%{opacity:1}to{opacity:1;transform:translate(102px,-34px)}}
.drop{animation:fall .8s ease-in forwards}
@keyframes fall{from{opacity:1;transform:translate(102px,-34px)}to{opacity:0;transform:translate(102px,6px)}}
.petal{animation:petal 2.4s ease-in forwards}
@keyframes petal{to{transform:translate(-14px,90px) rotate(200deg);opacity:0}}
@media (prefers-reduced-motion:reduce){.cloud,.pulse{animation:none}}
</style>
</head>
<body>
<main class="wrap">
<svg id="stage" viewBox="0 0 400 440" role="img" aria-label="Animasi: seorang cowo yang jauh dari ceweknya melihat bunga kecil di jalan sore tapi tidak memetiknya, membayangkan memberikannya langsung suatu hari nanti, lalu membawa pulang rasa ingin memberikannya">
  <defs>
    <linearGradient id="night" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#1c1433"/><stop offset="1" stop-color="#3f2c62"/></linearGradient>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#d9c8f5"/><stop offset=".55" stop-color="#ffd3dc"/><stop offset="1" stop-color="#ffe8cf"/></linearGradient>
    <linearGradient id="dusk" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#7a5aa8"/><stop offset=".55" stop-color="#ff9fb0"/><stop offset="1" stop-color="#ffd2a0"/></linearGradient>
    <radialGradient id="mist" cx=".5" cy=".5" r=".7"><stop offset=".55" stop-color="#fff" stop-opacity="0"/><stop offset="1" stop-color="#fff" stop-opacity=".5"/></radialGradient>
    <g id="bloom">
      <g fill="currentColor">
        <ellipse cy="-10" rx="6" ry="10"/><ellipse cy="-10" rx="6" ry="10" transform="rotate(60)"/><ellipse cy="-10" rx="6" ry="10" transform="rotate(120)"/>
        <ellipse cy="-10" rx="6" ry="10" transform="rotate(180)"/><ellipse cy="-10" rx="6" ry="10" transform="rotate(240)"/><ellipse cy="-10" rx="6" ry="10" transform="rotate(300)"/>
      </g>
      <circle r="5.5" fill="#ffd166"/>
    </g>
  </defs>

  <!-- Adegan 1: kamar, malam hari -->
  <g id="s1" class="fade on">
    <rect width="400" height="440" fill="url(#night)"/>
    <g fill="#fff"><circle cx="190" cy="50" r="1.5"/><circle cx="250" cy="90" r="1.5"/><circle cx="330" cy="46" r="1.8"/><circle cx="360" cy="120" r="1.4"/><circle cx="290" cy="150" r="1.3"/></g>
    <rect x="40" y="70" width="100" height="110" rx="10" fill="#26194a" stroke="#8a6fb0" stroke-width="4"/>
    <path d="M90 70V180M40 125H140" stroke="#8a6fb0" stroke-width="3"/>
    <circle cx="115" cy="98" r="14" fill="#fff3b0"/>

    <!-- cowo -->
    <g id="boyR">
      <ellipse cx="105" cy="352" rx="58" ry="54" fill="#7aa7ff"/>
      <circle cx="105" cy="262" r="30" fill="#ffe0c7"/>
      <path d="M75 262 Q73 228 105 226 Q137 228 135 262 Q123 246 105 246 Q87 246 75 262Z" fill="#3b2f3a"/>
      <g fill="#3a2a30"><circle cx="95" cy="266" r="2.6"/><circle cx="115" cy="266" r="2.6"/></g>
      <circle class="blush" cx="87" cy="277" r="5" fill="#ff6f91"/><circle class="blush" cx="123" cy="277" r="5" fill="#ff6f91"/>
      <path d="M98 277 Q105 285 112 277" stroke="#3a2a30" stroke-width="2" stroke-linecap="round" fill="none"/>
    </g>
    <g id="bR" class="bub" transform="translate(105 205)"></g>

    <!-- meja -->
    <rect y="345" width="400" height="95" fill="#7a4f58"/><rect y="345" width="400" height="8" fill="#946673"/>

    <!-- HP -->
    <circle class="pulse" cx="198" cy="328" r="30" fill="#bcd3ff" opacity=".2"/>
    <rect x="182" y="310" width="32" height="36" rx="6" fill="#241a3a"/>
    <rect class="pulse" x="186" y="314" width="24" height="26" rx="3" fill="#bcd3ff"/>
  </g>

  <!-- Adegan 2: bayangan "suatu saat nanti" -->
  <g id="s2" class="fade">
    <rect width="400" height="440" fill="url(#sky)"/>
    <circle cx="320" cy="72" r="34" fill="#fff3b0"/>
    <g class="cloud" fill="#fff" opacity=".85"><ellipse cx="70" cy="80" rx="34" ry="11"/><ellipse cx="94" cy="72" rx="22" ry="10"/></g>
    <path d="M0 300 Q100 250 200 290 T400 275 V440 H0Z" fill="#f5b5cf" opacity=".7"/>
    <rect y="330" width="400" height="110" fill="#b6dfa6"/><rect y="330" width="400" height="8" fill="#a3d195"/>
    <rect x="349" y="238" width="12" height="94" rx="4" fill="#9b6b52"/>
    <circle cx="355" cy="224" r="38" fill="#7bc47f"/><circle cx="334" cy="246" r="22" fill="#8fd18f"/><circle cx="378" cy="248" r="22" fill="#6fba76"/>
    <g style="color:#ffb703"><use href="#bloom" transform="translate(40 382) scale(.55)"/><use href="#bloom" transform="translate(330 388) scale(.55)"/></g>
    <g style="color:#b48cff"><use href="#bloom" transform="translate(120 402) scale(.55)"/><use href="#bloom" transform="translate(372 372) scale(.55)"/></g>
    <g style="color:#fff"><use href="#bloom" transform="translate(190 366) scale(.5)"/></g>

    <!-- cewe (menghadap kiri) -->
    <g id="girl" class="actor" style="transform:translate(292px,330px)">
      <g transform="scale(-1,1)">
        <path d="M-17 -92Q-22 -62 -14 -54L14 -54Q22 -62 17 -92Z" fill="#5a3a3a"/>
        <g stroke="#ffe0c7" stroke-width="5" stroke-linecap="round"><line x1="-5" y1="-30" x2="-5" y2="-3"/><line x1="5" y1="-30" x2="5" y2="-3"/></g>
        <path d="M-12 -76L12 -76L19 -26L-19 -26Z" fill="#ff9fb8"/>
        <circle cy="-92" r="16" fill="#ffe0c7"/>
        <path d="M-17 -92Q-18 -113 0 -111Q17 -113 17 -92Q10 -101 0 -100Q-10 -101 -17 -92Z" fill="#5a3a3a"/>
        <g fill="#3a2a30"><circle cx="4" cy="-93" r="2"/><circle cx="12" cy="-93" r="2"/></g>
        <circle class="blush" cx="2" cy="-86" r="3.6" fill="#ff6f91"/><circle class="blush" cx="15" cy="-86" r="3.6" fill="#ff6f91"/>
        <path class="neu" d="M5 -84L11 -84" stroke="#3a2a30" stroke-width="1.6" stroke-linecap="round" fill="none"/>
        <path class="smi" d="M4.5 -85Q8 -80 11.5 -85" stroke="#3a2a30" stroke-width="1.6" stroke-linecap="round" fill="none"/>
        <line x1="10" y1="-68" x2="22" y2="-48" stroke="#ffe0c7" stroke-width="4.5" stroke-linecap="round"/>
        <g id="gF" class="flw gone" transform="translate(22 -48)"><line y2="-26" stroke="#5fae6b" stroke-width="3" stroke-linecap="round"/><g transform="translate(0 -30) scale(.9)"><use href="#bloom"/></g></g>
      </g>
      <g id="bG" class="bub" transform="translate(0 -138)"></g>
    </g>

    <!-- cowo (datang membawa bunga) -->
    <g id="boy2" class="actor" style="transform:translate(-50px,330px)">
      <g class="bob">
        <g transform="translate(-5 -34)"><g class="l1"><line y2="34" stroke="#3d4a6b" stroke-width="5.5" stroke-linecap="round"/></g></g>
        <g transform="translate(5 -34)"><g class="l2"><line y2="34" stroke="#3d4a6b" stroke-width="5.5" stroke-linecap="round"/></g></g>
        <rect x="-13" y="-76" width="26" height="44" rx="9" fill="#7aa7ff"/>
        <circle cy="-92" r="16" fill="#ffe0c7"/>
        <path d="M-17 -92Q-18 -113 0 -111Q17 -113 17 -92Q10 -101 0 -100Q-10 -101 -17 -92Z" fill="#3b2f3a"/>
        <g fill="#3a2a30"><circle cx="4" cy="-93" r="2"/><circle cx="12" cy="-93" r="2"/></g>
        <circle class="blush" cx="2" cy="-86" r="3.6" fill="#ff6f91"/><circle class="blush" cx="15" cy="-86" r="3.6" fill="#ff6f91"/>
        <path d="M5 -84Q8 -81 11 -84" stroke="#3a2a30" stroke-width="1.6" stroke-linecap="round" fill="none"/>
        <g id="arm2" class="arm hid"><line x1="10" y1="-68" x2="22" y2="-48" stroke="#ffe0c7" stroke-width="4.5" stroke-linecap="round"/>
        <g id="bF2" class="flw" transform="translate(22 -48)"><line y2="-26" stroke="#5fae6b" stroke-width="3" stroke-linecap="round"/><g transform="translate(0 -30) scale(.9)"><use href="#bloom"/></g></g></g>
      </g>
      <g id="bB" class="bub" transform="translate(0 -138)"></g>
    </g>
    <rect width="400" height="440" fill="url(#mist)"/>
  </g>

  <!-- Adegan 3: jalan sore -->
  <g id="s3" class="fade">
    <rect width="400" height="440" fill="url(#dusk)"/>
    <circle cx="300" cy="238" r="38" fill="#ffd9a0"/>
    <g class="cloud" fill="#fff" opacity=".6"><ellipse cx="80" cy="70" rx="38" ry="11"/><ellipse cx="106" cy="62" rx="22" ry="10"/></g>
    <path d="M0 290Q110 250 220 285T400 270V440H0Z" fill="#b57fa8" opacity=".8"/>
    <rect y="332" width="400" height="108" fill="#8fb58a"/>
    <rect y="372" width="400" height="68" fill="#6e5f7a"/>
    <path d="M0 408H400" stroke="#d9cbe3" stroke-width="3" stroke-dasharray="22 16" opacity=".6"/>
    <g id="rf" class="fade">
      <circle class="pulse" cx="240" cy="314" r="28" fill="#fff3b0" opacity=".4"/>
      <line x1="240" y1="352" x2="240" y2="322" stroke="#5fae6b" stroke-width="3" stroke-linecap="round"/>
      <g transform="translate(240 314) scale(1.2)"><use href="#bloom"/></g>
    </g>
    <g id="boy3" class="actor" data-y="395" style="transform:translate(-50px,395px)"></g>
  </g>
</svg>

<button id="snd" type="button" aria-label="Matikan musik" hidden>🔊</button>

<div id="start">
  <h1>Ada yang mau<br>aku sampein ke kamu</h1>
  <div><button id="go" type="button">Buka</button></div>
</div>

<p id="cap" aria-live="polite"></p>
<div class="btns" id="nxw" hidden><button id="next" type="button">Lanjut</button></div>

<section id="end">
  <p id="msg"></p>
  <button id="again" type="button" class="ghost">Putar ulang</button>
</section>
</main>

<script>
/* Ubah teks di sini */
const CFG = {
  pesan: "Ini bunga kecil dari jauh. Kalau suatu hari aku bisa kasih langsung, kamu mau nerima?"
};


/* Musik: Dekat di Hati. File Dekat_di_Hati.mp3 harus satu folder dengan file HTML ini */
const Music=(()=>{
  const VOL=.6;
  let au, on=true, fade;
  function ramp(to,ms,done){
    clearInterval(fade);
    const from=au.volume, t0=performance.now();
    fade=setInterval(()=>{
      const k=Math.min(1,(performance.now()-t0)/ms);
      au.volume=from+(to-from)*k;
      if(k>=1){ clearInterval(fade); done&&done(); }
    },40);
  }
  return {
    start(){
      if(au){ if(on) au.play().catch(()=>{}); return; }
      au=new Audio('Dekat_di_Hati.mp3');
      au.loop=true; au.volume=0;
      au.addEventListener('error',()=>console.warn('File Dekat_di_Hati.mp3 tidak ditemukan / gagal dimuat'));
      au.play().then(()=>ramp(VOL,2500)).catch(err=>console.warn('Audio gagal:',err));
      document.addEventListener('visibilitychange',()=>{
        if(!on) return;
        document.hidden?au.pause():au.play().catch(()=>{});
      });
    },
    toggle(){
      on=!on;
      if(on){ au.play().catch(()=>{}); ramp(VOL,400); }
      else ramp(0,400,()=>{ if(!on) au.pause(); });
      return on;
    }
  };
})();

const $ = id => document.getElementById(id);
const NS = 'http://www.w3.org/2000/svg';
const stage = $('stage'), boy2 = $('boy2'), boy3 = $('boy3'), girl = $('girl'), boyR = $('boyR');
let timers = [], n = 0;
const at = (ms, fn) => timers.push(setTimeout(fn, ms));

document.querySelectorAll('.bub').forEach(g => g.innerHTML =
  '<rect y="-12" height="24" rx="12" fill="#fff"/><path d="M-5 12L0 19L5 12Z" fill="#fff"/><text text-anchor="middle" dominant-baseline="central" font-size="11" font-weight="700" fill="#4b2e45"></text>');

/* cowo di jalan sore = salinan cowo di padang bunga */
boy3.innerHTML = boy2.innerHTML.replace(/ id="[^"]*"/g, '');
boy3.querySelector('.bub').remove();
boy3.querySelector('.arm').classList.remove('hid');
const f3 = boy3.querySelector('.flw'); f3.id = 'bF3'; f3.classList.add('gone');

const show = id => ['s1','s2','s3'].forEach(s => $(s).classList.toggle('on', s === id));
function cap(t){ const c=$('cap'); c.classList.remove('on'); void c.offsetWidth; c.textContent=t; c.classList.add('on'); }
function go(el, x, d){ el.style.transitionDuration = d + 's'; el.style.transform = `translate(${x}px,${el.dataset.y||330}px)`; }
function halt(el){ go(el, new DOMMatrix(getComputedStyle(el).transform).m41, 0); el.classList.remove('walk'); }
function say(id, text, ms=1800){
  const g=$(id), t=g.querySelector('text'), r=g.querySelector('rect');
  t.textContent=text;
  const w=t.getComputedTextLength()+22;
  r.setAttribute('width',w); r.setAttribute('x',-w/2);
  g.classList.add('on'); clearTimeout(g._t);
  g._t=setTimeout(()=>g.classList.remove('on'),ms);
}
function mk(parent, cls, txt, x, y, size){
  const e=document.createElementNS(NS,'text');
  e.setAttribute('class',cls); e.textContent=txt; e.setAttribute('x',x); e.setAttribute('y',y);
  if(size) e.setAttribute('font-size',size);
  parent.appendChild(e); return e;
}
function burst(parent, cx, cy, emoji='💗', k=5){
  for(let i=0;i<k;i++){
    const h=mk(parent,'heart',emoji,cx-30+Math.random()*60,cy+Math.random()*20);
    h.style.animationDelay=(i*.25)+'s'; h.style.opacity=0;
    setTimeout(()=>h.remove(),3400);
  }
}
function petal(){
  const p=document.createElementNS(NS,'ellipse');
  p.setAttribute('class','petal'); p.setAttribute('cx',270); p.setAttribute('cy',256); p.setAttribute('rx',5); p.setAttribute('ry',3); p.setAttribute('fill','#ff6f9a');
  $('s2').insertBefore(p,$('s2').lastElementChild); setTimeout(()=>p.remove(),2600);
}

/* 12 ketukan */
const steps = [
  /* Bagian 1: jarak, lalu bunga di jalan */
  () => { show('s1'); cap('Kita ketemunya baru lewat layar.'); },
  () => { show('s3'); cap('Tadi sore aku lewat jalan yang biasa.'); boy3.classList.add('walk'); go(boy3,195,3.4); },
  () => { halt(boy3); $('rf').classList.add('on'); cap('Ada satu bunga kecil di pinggir jalan. Langsung kepikiran kamu.'); },
  () => {
    cap('Pengen banget kukasih ke kamu. Langsung, ke tangan kamu.');
    boy3.classList.add('walk'); go(boy3,218,1.2);
    at(1300,()=>{ boy3.classList.remove('walk'); boy3.classList.add('shy'); });
  },
  () => { show('s1'); cap('Tapi sekarang belum bisa. Jadi aku bayangin aja dulu…'); },
  /* Bagian 2: khayalan */
  () => { show('s2'); go(boy2,40,0); cap('Suatu hari, kita ketemu.'); },
  () => { boy2.classList.add('walk'); go(boy2,248,3.8); cap('Aku jalan ke arah kamu, jantungku nggak karuan.'); },
  () => { boy2.classList.remove('walk'); go(boy2,248,.4); petal(); cap('Aku udah latihan banyak kalimat. Semuanya hilang.'); },
  () => { $('arm2').classList.remove('hid'); boy2.classList.add('shy'); say('bB','Ini buat kamu.',3000); cap('Yang keluar cuma: “Ini buat kamu.”'); },
  () => { $('bF2').classList.add('gone'); $('gF').classList.remove('gone'); girl.classList.add('shy','happy'); burst($('s2'),270,235); cap('Dan kamu senyum. Cuma bayangan, tapi senyummu kerasa nyata.'); },
  /* Bagian 3: kembali ke kenyataan */
  () => { show('s1'); cap('Belum sekarang.'); },
  () => { burst($('s1'),198,300,'💗',4); cap('Tapi rasa pengen ngasihnya kubawa pulang. Sampai hari itu.'); }
];

function next(){
  if(n < steps.length){ steps[n++](); return; }
  $('nxw').hidden = true; $('cap').textContent = '';
  $('msg').textContent = CFG.pesan; $('end').classList.add('on');
}

function reset(){
  timers.forEach(clearTimeout); timers=[]; n=0;
  stage.classList.add('nt');
  document.querySelectorAll('#stage .on, #end.on').forEach(e=>e.classList.remove('on'));
  [boy2,boy3,girl,boyR].forEach(a=>a.classList.remove('walk','shy','happy'));
  go(boy2,-50,0); go(boy3,-50,0);
  $('s1').classList.add('on');
  $('bF2').classList.remove('gone'); $('arm2').classList.add('hid'); $('bF3').classList.add('gone');
  ['gF'].forEach(i=>$(i).classList.add('gone'));
  document.querySelectorAll('.heart,.petal').forEach(e=>e.remove());
  $('cap').textContent='';
  void stage.getBoundingClientRect();
  stage.classList.remove('nt');
}

function play(){ Music.start(); $('snd').hidden=false; reset(); $('start').classList.add('off'); $('nxw').hidden = false; next(); }

$('go').onclick = play;
$('next').onclick = next;
$('snd').onclick = ()=>{ const o=Music.toggle(); $('snd').textContent=o?'🔊':'🔇'; $('snd').setAttribute('aria-label',o?'Matikan musik':'Nyalakan musik'); };
$('again').onclick = play;
</script>
</body>
</html>
